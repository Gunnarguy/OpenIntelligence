name: EngineEvaluationHost
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    FRAMEWORK_SEARCH_PATHS:
      - $(inherited)
      - ..
    FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
      - $(inherited)
      - ../EvaluationSupport/iphonesimulator
      - ../EvaluationSupport/iphonesimulator/PackageFrameworks
    FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
      - $(inherited)
      - ../EvaluationSupport/iphoneos
      - ../EvaluationSupport/iphoneos/PackageFrameworks
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Engine Evaluation Host
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
      - UIInterfaceOrientationPortrait
      - UIInterfaceOrientationPortraitUpsideDown
      - UIInterfaceOrientationLandscapeLeft
      - UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
      - UIInterfaceOrientationPortrait
      - UIInterfaceOrientationPortraitUpsideDown
      - UIInterfaceOrientationLandscapeLeft
      - UIInterfaceOrientationLandscapeRight
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    OTHER_SWIFT_FLAGS:
      - $(inherited)
      - -cxx-interoperability-mode=default
    PRODUCT_BUNDLE_IDENTIFIER: Gunndamental.EngineEvaluationHost
    SWIFT_INCLUDE_PATHS:
      - $(inherited)
    SWIFT_INCLUDE_PATHS[sdk=iphonesimulator*]:
      - $(inherited)
      - ../EvaluationSupport/iphonesimulator
    SWIFT_INCLUDE_PATHS[sdk=iphoneos*]:
      - $(inherited)
      - ../EvaluationSupport/iphoneos
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  EngineEvaluationHost:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: EngineEvaluationHost
        excludes:
          - DemoAssets
          - "* 2.swift"
      - path: EngineEvaluationHost/DemoAssets
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../OpenIntelligenceEngine.xcframework
        embed: true

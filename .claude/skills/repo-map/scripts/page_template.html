<title>OpenIntelligence Repo Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#f2f5f4; --surface:#fcfcfb; --raised:#ffffff;
  --ink:#0e1614; --ink-2:#4b5753; --muted:#6f7a76; --hair:#dce2df; --hair-2:#e9eeec;
  --accent:#0b6e79; --accent-soft:#dcefef; --accent-ink:#ffffff;
  --cell-code:#d9e1de; --cell-other:#e8ecea;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b; --unk:#9a9892; --hist:#c9c7bd;
  --seq-1:#b7d3f6; --seq-2:#6da7ec; --seq-3:#2a78d6; --seq-4:#1c5cab; --seq-5:#0d366b;
  --shadow:0 1px 2px rgba(14,22,20,.06),0 10px 30px rgba(14,22,20,.08);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0b100f; --surface:#131918; --raised:#18201e;
    --ink:#ecf2f0; --ink-2:#a9b5b1; --muted:#8b9692; --hair:#26302d; --hair-2:#1d2624;
    --accent:#45b9c5; --accent-soft:#12302f; --accent-ink:#04191a;
    --cell-code:#2a3733; --cell-other:#1d2624; --unk:#8a8882; --hist:#4b4a45;
    --seq-1:#184f95; --seq-2:#256abf; --seq-3:#3987e5; --seq-4:#6da7ec; --seq-5:#b7d3f6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0b100f; --surface:#131918; --raised:#18201e;
  --ink:#ecf2f0; --ink-2:#a9b5b1; --muted:#8b9692; --hair:#26302d; --hair-2:#1d2624;
  --accent:#45b9c5; --accent-soft:#12302f; --accent-ink:#04191a;
  --cell-code:#2a3733; --cell-other:#1d2624; --unk:#8a8882; --hist:#4b4a45;
  --seq-1:#184f95; --seq-2:#256abf; --seq-3:#3987e5; --seq-4:#6da7ec; --seq-5:#b7d3f6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans)}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:24px}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.top .wrap{display:grid;grid-template-columns:1fr;gap:10px;padding-block:12px}
@media (min-width:900px){.top .wrap{grid-template-columns:auto 1fr;align-items:center;gap:28px}}
.brand h1{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em;margin:0;line-height:1.15;text-wrap:balance}
.brand .meta{color:var(--muted);font-size:12px;margin-top:2px}
.brand .meta b{color:var(--ink-2);font-weight:500}
.search{position:relative}
.search input{width:100%;height:44px;border-radius:10px;border:1px solid var(--hair);background:var(--surface);padding:0 14px 0 40px;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search .lens{position:absolute;left:13px;top:13px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.results{position:absolute;left:0;right:0;top:50px;background:var(--raised);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow);max-height:min(70vh,640px);overflow:auto;padding:6px}
.results h4{margin:10px 10px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.res{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 10px;border-radius:8px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.res:hover,.res[aria-selected="true"]{background:var(--accent-soft)}
.res .l{font-weight:600;overflow-wrap:anywhere}
.res .s{grid-column:1;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.res .r{grid-row:1/span 2;grid-column:2;align-self:center}
.empty{padding:14px 12px;color:var(--muted)}

/* summary */
.summary{display:grid;gap:14px;margin-block:18px 8px}
@media (min-width:900px){.summary{grid-template-columns:1.35fr 1fr}}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:16px 18px}
.card h2{font-family:var(--display);font-weight:700;font-size:17px;margin:0;letter-spacing:-.005em}
.card .sub{color:var(--muted);font-size:12.5px;margin:2px 0 12px}
.bar{display:flex;gap:2px;height:20px;margin-bottom:12px}
.bar span{display:block;height:100%;min-width:3px;cursor:pointer}
.bar span:first-child{border-radius:4px 0 0 4px}.bar span:last-child{border-radius:0 4px 4px 0}
.bar span:hover{filter:brightness(1.08)}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px}
.leg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);background:var(--raised);border-radius:999px;padding:3px 10px 3px 8px;cursor:pointer;font-size:12.5px}
.leg:hover{border-color:var(--accent)}
.leg .n{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tile:hover{border-color:var(--accent)}
.tile .v{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1}
.tile .k{color:var(--ink-2);font-size:12.5px}
.tile .go{color:var(--accent);font-size:12px;margin-top:auto;padding-top:4px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;border-radius:999px;padding:2px 9px 2px 6px;background:var(--hair-2);color:var(--ink)}
.ic{display:inline-flex;width:15px;height:15px}
.ic svg{width:15px;height:15px}
.tag{display:inline-block;font-size:11px;border:1px solid var(--hair);border-radius:6px;padding:0 6px;color:var(--ink-2);white-space:nowrap}
.tag.alert{border-color:color-mix(in srgb,var(--critical) 55%,var(--hair));color:var(--ink)}
.tag.warnish{border-color:color-mix(in srgb,var(--warn) 70%,var(--hair))}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--hair);margin-top:18px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{padding-block:18px 60px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.fchip{border:1px solid var(--hair);background:var(--surface);border-radius:999px;padding:4px 11px 4px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.fchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fchip .n{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
select.sel{border:1px solid var(--hair);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:13px}
details.explain{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:10px 14px;margin-bottom:14px}
details.explain summary{cursor:pointer;font-weight:600}
details.explain dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:10px 0 2px}
details.explain dt{white-space:nowrap}
details.explain dd{margin:0;color:var(--ink-2);max-width:70ch}
@media (max-width:640px){details.explain dl{grid-template-columns:1fr}}

/* rows */
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:170px 1fr 150px 90px;gap:4px 16px;align-items:start;padding:10px 14px;background:var(--surface);border:1px solid var(--hair);border-radius:10px;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--accent)}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .p{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.row .w{color:var(--ink-2);font-size:12.5px;grid-column:2}
.row .d{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.row .x{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
@media (max-width:760px){.row{grid-template-columns:1fr}.row .w{grid-column:1}.row .x{text-align:left}}

/* code groups */
.group{background:var(--surface);border:1px solid var(--hair);border-radius:12px;margin-bottom:8px}
.group>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:12px 14px}
.group>summary::-webkit-details-marker{display:none}
.group>summary .gname{font-weight:700;font-family:var(--display);font-size:15px}
.group>summary .gmeta{color:var(--muted);font-size:12.5px;font-family:var(--mono)}
.group>summary .owners{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.group[open]>summary{border-bottom:1px solid var(--hair)}
.files{display:flex;flex-direction:column}
.file{display:grid;grid-template-columns:minmax(180px,260px) 1fr auto;gap:2px 14px;padding:8px 14px;border:0;border-top:1px solid var(--hair-2);background:none;text-align:left;cursor:pointer;width:100%}
.file:first-child{border-top:0}
.file:hover{background:var(--accent-soft)}
.file .fn{font-family:var(--mono);font-size:12.5px;font-weight:500;overflow-wrap:anywhere}
.file .fb{color:var(--ink-2);font-size:12.5px}
.file .ft{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.file .sub{grid-column:1/-1;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
@media (max-width:760px){.file{grid-template-columns:1fr}.file .ft{justify-content:flex-start}}

/* how */
figure.flow{margin:0 0 18px;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:14px}
.flowscroll{overflow-x:auto}
.flowscroll svg{display:block;min-width:900px;width:100%;height:auto;color:var(--ink)}
figure.flow figcaption{color:var(--ink-2);font-size:13px;margin-top:10px;max-width:90ch}
.node{cursor:pointer}
.node rect.box{fill:var(--raised);stroke:currentColor;stroke-opacity:.28;stroke-width:1.2}
.node:hover rect.box,.node:focus-visible rect.box{stroke:var(--accent);stroke-opacity:1;stroke-width:2}
.node text.nt{font:600 13px var(--sans);fill:currentColor}
.node text.ns{font:11px var(--mono);fill:var(--muted)}
.edge{stroke:currentColor;stroke-opacity:.55;stroke-width:1.5;fill:none}
.edge.key{stroke:var(--accent);stroke-opacity:1;stroke-width:2}
.elabel{font:11px var(--sans);fill:var(--ink-2)}
.elabel.key{fill:var(--accent);font-weight:600}
.h3{font-family:var(--display);font-weight:700;font-size:16px;margin:22px 0 10px}
.vocab{display:grid;gap:8px}
@media (min-width:900px){.vocab{grid-template-columns:1fr 1fr}}
.vcard{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:12px 14px}
.vcard .vn{font-weight:700}
.vcard .vf{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px}
.linkbtn{border:1px solid var(--hair);background:var(--raised);border-radius:7px;padding:2px 8px;font-family:var(--mono);font-size:12px;cursor:pointer}
.linkbtn:hover{border-color:var(--accent)}
.vcard .vs{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
table.plain{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--hair);border-radius:12px;overflow:hidden}
table.plain th,table.plain td{text-align:left;padding:9px 12px;border-top:1px solid var(--hair-2);vertical-align:top;font-size:13px}
table.plain th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0;font-weight:600}
table.plain td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}

/* map */
.mapbox{position:relative;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:10px}
#mapsvg{display:block;width:100%}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.crumbs button{border:0;background:none;padding:2px 4px;cursor:pointer;color:var(--accent);font-weight:600}
.crumbs span.sep{color:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--raised);border:1px solid var(--hair);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;font-size:12.5px;max-width:340px;z-index:5}
.tip .tv{font-weight:700}
.tip .tp{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.cell{cursor:pointer}
.cell:hover{filter:brightness(1.1)}
.grp{fill:none;stroke:var(--hair)}
.grp-hit{fill:transparent;cursor:zoom-in}
.grp-label{font:600 11.5px var(--sans);fill:var(--ink-2);pointer-events:none}
.cell-label{font:10.5px var(--mono);pointer-events:none}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,10,9,.32);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--raised);border-left:1px solid var(--hair);box-shadow:var(--shadow);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dhead{display:flex;gap:10px;align-items:flex-start;padding:16px 18px 12px;border-bottom:1px solid var(--hair)}
.dhead h3{font-family:var(--display);font-weight:700;font-size:18px;margin:0;line-height:1.25;overflow-wrap:anywhere;text-wrap:balance}
.dhead .dp{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin-top:4px}
.dclose{margin-left:auto;border:1px solid var(--hair);background:var(--surface);border-radius:8px;width:34px;height:34px;flex:none;cursor:pointer;font-size:18px;line-height:1}
.dbody{overflow:auto;padding:14px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.dsec{margin-bottom:16px}
.dsec h5{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.dsec ul{margin:0;padding-left:18px}
.dsec li{margin:3px 0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.refbad{display:grid;grid-template-columns:70px 1fr;gap:2px 10px;font-size:12.5px;padding:6px 0;border-top:1px solid var(--hair-2)}
.refbad .rk{color:var(--muted)}
.refbad .rr{font-family:var(--mono);overflow-wrap:anywhere}
.refbad .rw{grid-column:2;color:var(--ink-2)}
footer{color:var(--muted);font-size:12.5px;padding-block:10px 40px;border-top:1px solid var(--hair);margin-top:10px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>OpenIntelligence Repo Map</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="search" role="search">
      <svg class="lens" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Find a feature, file, type or doc: try HUD, paywall, RAGService" aria-label="Search the repository" aria-controls="results">
      <div class="results" id="results" role="listbox" hidden></div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="summary" aria-label="Summary">
    <div class="card">
      <h2>Can I trust this doc?</h2>
      <div class="sub" id="trustsub"></div>
      <div class="bar" id="trustbar" role="img"></div>
      <div class="legend" id="trustlegend"></div>
    </div>
    <div class="tiles" id="tiles"></div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" id="tab-how" aria-controls="p-how" data-tab="how">How it fits together</button>
    <button role="tab" id="tab-docs" aria-controls="p-docs" data-tab="docs">Docs</button>
    <button role="tab" id="tab-code" aria-controls="p-code" data-tab="code">Code</button>
    <button role="tab" id="tab-map" aria-controls="p-map" data-tab="map">Map</button>
    <button role="tab" id="tab-loose" aria-controls="p-loose" data-tab="loose">Loose files</button>
  </nav>

  <section class="panel" id="p-how" role="tabpanel" aria-labelledby="tab-how"></section>
  <section class="panel" id="p-docs" role="tabpanel" aria-labelledby="tab-docs" hidden></section>
  <section class="panel" id="p-code" role="tabpanel" aria-labelledby="tab-code" hidden></section>
  <section class="panel" id="p-map" role="tabpanel" aria-labelledby="tab-map" hidden></section>
  <section class="panel" id="p-loose" role="tabpanel" aria-labelledby="tab-loose" hidden></section>

  <footer id="foot"></footer>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dtitle">
  <div class="dhead">
    <div><h3 id="dtitle"></h3><div class="dp" id="dpath"></div></div>
    <button class="dclose" id="dclose" aria-label="Close">×</button>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>

<script type="application/json" id="data">/*__DATA__*/</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(() => {
const D = JSON.parse(document.getElementById('data').textContent);
const HEAD = D.head, SHORT = HEAD.slice(0, 7), REPO = 'https://github.com/' + D.repo, LINK = D.link_sha || D.head;
const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString('en-US');
const today = new Date(D.generated.slice(0, 10) + 'T12:00:00');
const daysAgo = d => d ? Math.round((today - new Date(d + 'T12:00:00')) / 864e5) : null;
const ago = d => { const n = daysAgo(d); if (n == null) return 'never committed'; if (n <= 0) return 'today'; if (n === 1) return 'yesterday'; if (n < 60) return n + ' days ago'; return Math.round(n / 30.4) + ' months ago'; };
const blob = p => REPO + '/blob/' + LINK + '/' + p.split('/').map(encodeURIComponent).join('/');
const hist = p => REPO + '/commits/' + LINK + '/' + p.split('/').map(encodeURIComponent).join('/');
const commit = s => REPO + '/commit/' + s;
const base = p => p.split('/').pop();

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'on') for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (k === 'html') el.innerHTML = v;  // trusted constants only (icons)
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
}

/* ---------- status vocabulary ---------- */
const ICON = {

/* ---------- indexes ---------- */
const files = D.files, docs = D.docs;
const fileBy = new Map(files.map(f => [f.p, f]));
const docBy = new Map(docs.map(d => [d.path, d]));
const swift = files.filter(f => f.k && f.k !== 'vendored');
const typeTo = new Map();
for (const f of swift) for (const t of (f.types || [])) if (!typeTo.has(t)) typeTo.set(t, f.p);
const docOf = name => {
  if (/atlas/i.test(name)) return 'Docs/OPENINTELLIGENCE_ARCHITECTURE_ATLAS.md';
  if (/^canonical/i.test(name)) return 'Docs/CANONICAL_OPENINTELLIGENCE_SOURCE_OF_TRUTH.md';
  return name;
};
function ownerDocs(owner) {
  const out = new Set();
  for (const m of owner.matchAll(/[\w./-]+\.md/g)) out.add(m[0]);
  if (/atlas/i.test(owner)) out.add(docOf('atlas'));
  if (/canonical/i.test(owner)) out.add(docOf('canonical'));
  return [...out].filter(p => docBy.has(p));
}

/* ---------- header, summary ---------- */

const bar = $('#trustbar');
bar.setAttribute('aria-label', ORDER.map(s => `${counts[s]} ${ST[s].label}`).join(', '));
for (const s of ORDER) if (counts[s]) {

/* ---------- tabs ---------- */
const TABS = ['how', 'docs', 'code', 'map', 'loose'];
function go(t) {
  for (const x of TABS) {
    $('#tab-' + x).setAttribute('aria-selected', x === t);
    $('#p-' + x).hidden = x !== t;
  }
  if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
  try { localStorage.setItem('oi-map-tab', t); } catch (e) {}
  if (t === 'map') renderMap();
}
for (const b of document.querySelectorAll('.tabs button')) b.addEventListener('click', () => go(b.dataset.tab));
addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.includes(t)) go(t); });

/* ---------- drawer ---------- */
const drawer = $('#drawer'), scrim = $('#scrim'), dbody = $('#dbody');
let lastFocus = null;
function openDrawer(title, path, build) {
  lastFocus = document.activeElement;
  $('#dtitle').textContent = title;
  $('#dpath').textContent = path || '';
  dbody.replaceChildren();
  build(dbody);
  drawer.hidden = false; scrim.hidden = false;
  dbody.scrollTop = 0;
  $('#dclose').focus();
}
function closeDrawer() { drawer.hidden = true; scrim.hidden = true; if (lastFocus) lastFocus.focus(); }
$('#dclose').addEventListener('click', closeDrawer);
scrim.addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !drawer.hidden) closeDrawer(); });
const sec = (title, ...kids) => h('div', {class: 'dsec'}, h('h5', null, title), ...kids);
function copyBtn(text, label) {
  const b = h('button', {class: 'btn'}, label);
  b.addEventListener('click', () => {
    const done = () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = label, 1400); };
    navigator.clipboard?.writeText(text).then(done, () => { const r = document.createRange(); r.selectNodeContents($('#dpath')); getSelection().removeAllRanges(); getSelection().addRange(r); });
  });
  return b;
}
function actions(p) {
  return h('div', {class: 'acts'},
    h('a', {class: 'btn primary', href: blob(p), target: '_blank', rel: 'noopener'}, 'Open on GitHub'),
    h('a', {class: 'btn', href: hist(p), target: '_blank', rel: 'noopener'}, 'History'),
    copyBtn(base(p), 'Copy name for Xcode ⌘⇧O'),
    copyBtn(p, 'Copy path'));
}
function pathLink(p) {
  const known = docBy.has(p) || fileBy.has(p);
  return known ? h('button', {class: 'linkbtn', on: {click: () => openAny(p)}}, p) : h('span', {class: 'mono'}, p);
}
function lastEdit(f) {
  const sha = f.sha || f.last?.sha, date = typeof f.last === 'string' ? f.last : f.last?.date, subj = f.last?.subject;
  return h('dl', {class: 'kv'},
    h('dt', null, 'Last edited'), h('dd', null, date ? `${date} (${ago(date)})` : '—', sha ? [' · ', h('a', {href: commit(sha), target: '_blank', rel: 'noopener', class: 'mono'}, sha)] : null),
    subj ? [h('dt', null, 'Commit'), h('dd', null, subj)] : null,
    h('dt', null, 'Commits'), h('dd', null, String(f.edits ?? '—')),
    f.lines != null ? [h('dt', null, 'Lines'), h('dd', null, fmt(f.lines))] : null);
}
function openAny(p) {
  if (docBy.has(p)) return openDoc(docBy.get(p));
  const f = fileBy.get(p);
  if (f && f.k) return openSwift(f);
  if (f) return openDrawer(base(p), p, b => { b.append(actions(p), lastEdit(f)); });
}
function openDoc(d) {
  openDrawer(d.title || base(d.path), d.path, b => {
    b.append(actions(d.path));
    b.append(sec('Status', h('div', null, chip(d.status)), h('ul', null, d.why.map(w => h('li', null, w)))));
    if (d.summary) b.append(sec('What it says it is', h('div', null, d.summary)));
    if (d.refs_broken.length) b.append(sec(`References that no longer resolve (${d.n_broken})`,
      ...d.refs_broken.map(r => h('div', {class: 'refbad'}, h('span', {class: 'rk'}, r.kind), h('span', {class: 'rr'}, r.ref), h('span', {class: 'rw'}, r.why)))));
    const ch = Object.entries(d.code_changed_since || {}).sort((a, b) => b[1] - a[1]);
    if (ch.length) b.append(sec(`Code it cites that changed after its last edit`, h('ul', null, ch.map(([p, n]) => h('li', null, pathLink(p), ` ${n} commit${n > 1 ? 's' : ''}`)))));
    if (d.same_name?.length) b.append(sec('Another doc has the same name', h('ul', null, d.same_name.map(p => h('li', null, pathLink(p))))));
    b.append(sec(`Pointed to by (${d.inbound.length})`, d.inbound.length ? h('ul', null, d.inbound.slice(0, 40).map(p => h('li', null, pathLink(p)))) : h('div', {class: 'muted'}, 'Nothing in the repository names this file.')));

      h('dt', null, 'References checked'), h('dd', null, `${d.refs_ok + d.n_broken} (${d.n_broken} dead)`),
      h('dt', null, 'Category'), h('dd', null, d.category),
      h('dt', null, 'Gate'), h('dd', null, d.gate_checked ? 'scripts/verify_doc_claims.py checks it' : 'not in the gate\'s list'))));
    b.append(sec('History', lastEdit({...d, lines: d.lines})));
  });
}
function openSwift(f) {
  openDrawer(base(f.p), f.p, b => {
    b.append(actions(f.p));
    const tags = h('div', {class: 'acts'}, useChip(f), h('span', {class: 'tag'}, f.k === 'test' ? 'Test' : f.engine ? 'App + Engine SDK target' : 'App target only'), f.area ? h('span', {class: 'tag'}, f.area) : null);
    b.append(tags);
    if (f.blurb) b.append(sec('What it says it does', h('div', null, f.blurb)));
    if (f.types?.length) b.append(sec('Declares', h('div', {class: 'mono'}, f.types.join(', '))));
    if (f.use === 'orphan') b.append(sec('Why it counts as unused', h('div', null, 'No other Swift file names any type it declares or calls any extension method it adds, and it is not something the system finds on its own (an App Intent, widget or @main). Check before deleting: code can also be reached through strings or reflection.')));
    b.append(sec(`Used by (${f.n_used_by ?? 0})`, f.used_by?.length ? h('ul', null, f.used_by.map(p => h('li', null, pathLink(p))), f.n_used_by > f.used_by.length ? h('li', {class: 'muted'}, `and ${f.n_used_by - f.used_by.length} more`) : null) : h('div', {class: 'muted'}, f.k === 'test' ? 'A test file.' : 'No other file names its types.')));
    if (f.tested_by?.length) b.append(sec('Tested by', h('ul', null, f.tested_by.map(p => h('li', null, pathLink(p))))));
    if (f.unused_types?.length) b.append(sec('Types inside that nothing uses', h('div', {class: 'mono'}, f.unused_types.join(', '))));
    b.append(sec('History', lastEdit(f)));
  });
}
function openArea(title, prefixes, owners) {
  const inArea = f => prefixes.some(px => f.p === px || f.p.startsWith(px + '/'));
  const sw = swift.filter(inArea).sort((a, b) => a.p.localeCompare(b.p));
  const ds = docs.filter(d => inArea({p: d.path}));
  openDrawer(title, prefixes.join('  ·  '), b => {
    if (owners?.length) b.append(sec('Owning docs', h('div', {class: 'acts'}, owners.map(p => h('button', {class: 'btn', on: {click: () => openDoc(docBy.get(p))}}, chip(docBy.get(p).status), ' ', base(p))))));
    const un = sw.filter(f => f.use === 'orphan').length;
    b.append(sec(`Swift files (${sw.length}${un ? `, ${un} unused` : ''})`, h('div', {class: 'files'}, sw.map(fileRow))));
    if (ds.length) b.append(sec(`Docs here (${ds.length})`, h('div', {class: 'rows'}, ds.map(docRow))));
  });
}

function docRow(d) {
  const lead = d.status === 'verified' || d.status === 'current' ? d.why[0] : (d.why.find(w => !/^An |^In Docs|^Marks|^Only/.test(w)) || d.why[0]);

    h('div', null, chip(d.status)),
    h('div', null, h('div', {class: 't'}, d.title || base(d.path)), h('div', {class: 'p'}, d.path)),
    h('div', {class: 'd'}, d.last.date || '—', h('div', {class: 'muted'}, ago(d.last.date))),
    h('div', {class: 'x'}, `${d.inbound.length} link${d.inbound.length === 1 ? '' : 's'} in`),

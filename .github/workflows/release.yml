name: Release (Archive & Export)

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: "Upload .ipa/.xcarchive artifacts"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 8 * * *" # daily 08:00 UTC

jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode 26.0.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0.1"

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence

      - name: Clean & build diagnostics
        run: |
          ./clean_and_rebuild.sh

      - name: Run diagnostics suite
        env:
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          xcodebuild test \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            -skipPackagePluginValidation \
            -quiet

      - name: Archive app
        env:
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          xcodebuild archive \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence \
            -destination 'generic/platform=iOS' \
            -archivePath build/OpenIntelligence.xcarchive \
            CODE_SIGN_STYLE=Manual

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/OpenIntelligence.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist Docs/reference/exportOptions.plist

      - name: Upload artifacts
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenIntelligence-ipa
          path: build/export

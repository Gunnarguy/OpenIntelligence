name: Create Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          echo "Using: $(xcodebuild -version | head -1)"

      - name: Get Simulator
        id: sim
        run: |
          for DEVICE in "iPhone 17 Pro Max" "iPhone 17 Pro" "iPhone 16 Pro Max" "iPhone 16 Pro"; do
            if xcrun simctl list devices available | grep -q "$DEVICE"; then
              echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | xargs)
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build for Release
        run: |
          xcodebuild \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.device }}' \
            -configuration Release \
            -derivedDataPath build/ \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## What's Changed
            - Auto-generated release from tag ${{ github.ref_name }}

            ## Installation
            - Install the shipped product from the App Store link in README.md.
            - Clone this repository only if you want to build the public SwiftUI demo shell.

            ## Notes
            - This public snapshot intentionally excludes private engine internals.
            - App Store submission and commercialization tooling stay in the private engine repo.
            - The GitHub release is source/docs for the public surface, not an installable iOS binary.

            ## Requirements
            - iOS 26.0+
            - Xcode 26+
          draft: false
          prerelease: false

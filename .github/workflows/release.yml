name: Release (Archive & Export)

on:
  workflow_dispatch:
    inputs:
      perform_export:
        description: "Perform archive + export (requires App Store signing assets on runner)"
        required: false
        default: false
        type: boolean
      upload_artifacts:
        description: "Upload .ipa/.xcarchive artifacts"
        required: false
        default: true
        type: boolean

jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || echo "/Applications/Xcode.app")
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "Using: $(xcodebuild -version | head -1)"

      - name: Get Simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+ Pro' | head -1 | xargs)
          [ -z "$DEVICE" ] && DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | xargs)
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence

      - name: Clean & build diagnostics
        run: |
          if [ -f clean_and_rebuild.sh ]; then
            ./clean_and_rebuild.sh
          else
            echo "No clean_and_rebuild.sh found, skipping"
          fi

      - name: Build (iOS Simulator)
        env:
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          xcodebuild build \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.device }}' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          echo "✅ Build succeeded"

      - name: Archive app
        if: ${{ inputs.perform_export }}
        env:
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          xcodebuild archive \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence \
            -destination 'generic/platform=iOS' \
            -archivePath build/OpenIntelligence.xcarchive \
            CODE_SIGN_STYLE=Manual

      - name: Export IPA
        if: ${{ inputs.perform_export }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/OpenIntelligence.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist Docs/reference/exportOptions.plist

      - name: Upload artifacts
        if: ${{ inputs.perform_export && inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenIntelligence-ipa
          path: build/export

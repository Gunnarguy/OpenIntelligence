name: Create Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/SwiftPackageManager
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Setup Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          echo "Using: $(xcodebuild -version | head -1)"

      - name: Get Simulator
        id: sim
        run: |
          for DEVICE in "iPhone 17 Pro Max" "iPhone 17 Pro" "iPhone 16 Pro Max" "iPhone 16 Pro"; do
            if xcrun simctl list devices available | grep -q "$DEVICE"; then
              echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | xargs)
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence

      - name: Build for Release
        run: |
          xcodebuild \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.device }}' \
            -configuration Release \
            -derivedDataPath build/ \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## What's Changed
            - Auto-generated release from tag ${{ github.ref_name }}

            ## Installation
            1. Clone the repository
            2. Open in Xcode 26+
            3. Build and run on your device
            4. Configure your API keys in Settings

            ## Requirements
            - iOS 26.0+
            - Xcode 26+
            - Valid API keys for enabled services
          draft: false
          prerelease: false

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build and Check
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/SwiftPackageManager
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Setup Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          echo "Using: $(xcodebuild -version | head -1)"

      - name: Get Simulator
        id: sim
        run: |
          for DEVICE in "iPhone 17 Pro Max" "iPhone 17 Pro" "iPhone 16 Pro Max" "iPhone 16 Pro"; do
            if xcrun simctl list devices available | grep -q "$DEVICE"; then
              echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
              echo "Using simulator: $DEVICE"
              exit 0
            fi
          done
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | xargs)
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence

      - name: Validate Source SDK Consumer Flow
        run: |
          chmod +x scripts/validate_source_sdk_package.sh \
                   scripts/validate_source_sdk_consumer_flow.sh \
                   Samples/SourceSDKHost/build_sample_app.sh
          ./scripts/validate_source_sdk_consumer_flow.sh

      - name: Build (iOS Simulator)
        run: |
          xcodebuild clean build \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.device }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Tests
        run: |
          xcodebuild test \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.device }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult || true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/SwiftPackageManager
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # Runs before the build because it needs no toolchain and takes about a
      # second. A public claim whose implementation has been deleted is worth
      # failing fast on, and this catches nothing the build would have caught.
      - name: Verify claimed capabilities still have their implementation
        run: python3 scripts/verify_capabilities.py

      - name: Select Xcode
        run: |
          echo "=== Installed Xcodes ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "None found"
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting: $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          echo "Using: $(xcodebuild -version | head -1)"

      - name: Resolve Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence \
            -skipPackagePluginValidation

      - name: Build App
        run: |
          xcodebuild clean build \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

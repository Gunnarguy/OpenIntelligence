name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/SwiftPackageManager
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Select Xcode
        run: |
          echo "=== Installed Xcodes ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "None found"
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting: $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          echo "Using: $(xcodebuild -version | head -1)"

      - name: Resolve Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence \
            -skipPackagePluginValidation

      - name: Build App
        run: |
          xcodebuild clean build \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO > build.log 2>&1

      - name: Print build log and push to debug branch on failure
        if: failure()
        run: |
          tail -n 200 build.log
          git config --global user.name "Actions Bot"
          git config --global user.email "bot@github.com"
          git checkout -b debug-build-log || git checkout debug-build-log
          cp build.log build_debug.txt
          git add build_debug.txt
          git commit -m "debug: build log on failure"
          git push -f origin debug-build-log

# Archive, gate, and upload a build to App Store Connect.
#
# Why this exists, and it is not the reason it first looked like.
#
# The owner's Mac runs macOS 27.0 beta. Every archive stamps BuildMachineOSBuild
# into Info.plist, and App Store ingestion rejects a prerelease stamp with
# ITMS-90111 regardless of which Xcode produced the binary. Builds 376 and 377
# were archived locally on Xcode 26.6 and both carry `26A5406e`, a prerelease
# stamp, even though `altool --validate-app` returned VERIFY SUCCEEDED for both.
# Validation is not ingestion. Learned in the OpenManual repository first.
#
# GitHub's runner images use released OS builds, so the stamp comes out clean.
# That, not runner convenience, is the point of this workflow. Xcode Cloud would
# also work and is compute-capped as of 2026-08-25.
#
# The toolchain is separately load-bearing. Every Private Cloud Compute path
# sits behind `#if compiler(>=6.4)`: Xcode 26.x ships Swift 6.3 and compiles
# them out, Xcode 27 ships Swift 6.4 and compiles them IN, which would
# contradict the 5.0 release notes and the in-app copy. Three checks below
# enforce the outcome rather than trusting the selection.

name: App Store Upload

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion to stamp. Must exceed the newest build on the train (377 as of 2026-08-25)."
        required: true
        type: string
        default: "378"
      upload:
        description: "Upload to App Store Connect. Uncheck to archive and validate only."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  upload:
    name: Archive, gate, upload
    runs-on: macos-26
    timeout-minutes: 90

    env:
      ARCHIVE: ${{ github.workspace }}/build/OpenIntelligence.xcarchive
      EXPORT: ${{ github.workspace }}/build/export

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image ships several Xcodes. Pick the highest non-beta: a beta SDK is
      # rejected at upload, and an Xcode older than 26 cannot compile against
      # this app's iOS 26.0 deployment target at all.
      - name: Select the newest released Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | grep -iv beta | sort -V | tail -1)
          echo "selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"

      - name: Show the toolchain and OS
        # Both of these are stamped into the binary. Printed so a future
        # ITMS-90111 is diagnosable from the log rather than guessed at.
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i iphoneos
          SWIFT_VER="$(swift --version 2>&1 | sed -nE 's/.*Apple Swift version ([0-9]+\.[0-9]+).*/\1/p' | head -1)"
          if [ "$(printf '%s\n6.4\n' "$SWIFT_VER" | sort -V | head -1)" = "6.4" ]; then
            echo "::error::Swift $SWIFT_VER satisfies #if compiler(>=6.4), which compiles PCC IN. Refusing to build a release on this toolchain."
            exit 1
          fi

      # Same guard Xcode Cloud runs: stamps MARKETING_VERSION from CHANGELOG.md
      # and refuses to build while [Unreleased] still has entries.
      - name: Stamp version from CHANGELOG
        working-directory: ci_scripts
        run: sh ci_post_clone.sh

      # OpenManual's proven workflow imports no certificate at all and lets
      # -allowProvisioningUpdates create one through the API key. This uses the
      # stored p12 when it works, because that is deterministic and avoids
      # burning one of the three distribution certificates an account may hold,
      # but it must never be the reason a release fails: the secret dates from
      # 2026-06-19 and has never been exercised. On any failure the keychain
      # search list is restored so the login keychain is not left hidden, and
      # the archive proceeds on the API key alone.
      - name: Import the distribution certificate
        continue-on-error: true
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -uo pipefail
          restore() { security list-keychains -d user -s login.keychain-db || true; }
          if [ -z "${DIST_CERT_P12_BASE64:-}" ]; then
            echo "::warning::DIST_CERT_P12_BASE64 is empty. Falling back to -allowProvisioningUpdates."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          {
            security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN" &&
            security set-keychain-settings -lut 21600 "$KEYCHAIN" &&
            security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN" &&
            printf '%s' "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12" &&
            security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security -f pkcs12 &&
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null &&
            security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          } || {
            echo "::warning::Certificate import failed. Restoring the keychain search list and continuing on -allowProvisioningUpdates."
            restore
            rm -f "$RUNNER_TEMP/dist.p12"
            exit 0
          }
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "Identities available to codesign:"
          security find-identity -v -p codesigning | sed -E 's/[0-9A-F]{40}/<SHA1>/'
          if ! security find-identity -v -p codesigning | grep -q "Apple Distribution"; then
            echo "::warning::No Apple Distribution identity after import. Continuing on -allowProvisioningUpdates."
            restore
          fi

      # ~/.appstoreconnect/private_keys is where altool, notarytool and
      # Transporter auto-discover a key given only --apiKey and --apiIssuer.
      - name: Write the App Store Connect key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEYFILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$KEYFILE"
          chmod 600 "$KEYFILE"
          openssl ec -in "$KEYFILE" -noout && echo "API key parses"
          echo "ASC_KEY_FILE=$KEYFILE" >> "$GITHUB_ENV"

      # -allowProvisioningUpdates with the API key lets Xcode fetch or create the
      # App Store profiles for both the app and the LiveActivities extension,
      # which a fresh runner does not have.
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_FILE" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ inputs.build_number }}

      # The whole reason this workflow exists. Fail here rather than after a
      # round trip through App Store ingestion.
      - name: Confirm the build machine stamp is not a prerelease
        run: |
          set -euo pipefail
          APP="$ARCHIVE/Products/Applications/OpenIntelligence.app"
          STAMP=$(/usr/libexec/PlistBuddy -c "Print :BuildMachineOSBuild" "$APP/Info.plist")
          echo "BuildMachineOSBuild: $STAMP"
          echo "DTXcodeBuild:        $(/usr/libexec/PlistBuddy -c 'Print :DTXcodeBuild' "$APP/Info.plist")"
          case "$STAMP" in
            *[a-z]) echo "::error::Prerelease OS stamp ($STAMP). App Store ingestion rejects this with ITMS-90111."; exit 1 ;;
          esac
          echo "Released OS stamp. Safe to submit."

      # 0 alone is not evidence: a broken grep also returns 0, so the control
      # must be non-zero for the absence to mean anything.
      - name: Gate on Private Cloud Compute symbols
        run: |
          set -euo pipefail
          BIN="$ARCHIVE/Products/Applications/OpenIntelligence.app/OpenIntelligence"
          test -f "$BIN" || { echo "::error::No binary at $BIN"; exit 1; }
          PCC="$(nm -u "$BIN" | grep -c PrivateCloudCompute || true)"
          CONTROL="$(nm -u "$BIN" | grep -c SystemLanguageModel || true)"
          echo "PrivateCloudCompute symbols: $PCC (must be 0)"
          echo "SystemLanguageModel symbols: $CONTROL (control, must be > 0)"
          if [ "$CONTROL" -eq 0 ]; then
            echo "::error::Control is 0, so this check proves nothing. FoundationModels is not linked as expected."
            exit 1
          fi
          if [ "$PCC" -ne 0 ]; then
            echo "::error::$PCC PrivateCloudCompute symbols linked. This build would ship PCC into a release whose notes say it does not."
            exit 1
          fi
          echo "Gate passed: PCC compiled out."

      - name: Export the App Store IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>teamID</key><string>Z3E334EXZD</string>
              <key>signingStyle</key><string>automatic</string>
              <key>uploadSymbols</key><true/>
              <key>destination</key><string>export</string>
              <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates
          ls -lh "$EXPORT"

      # A local rsync once copied swift-transformers/.build into the bundle and
      # App Store Connect rejected it as 90171 after a full 202 MB upload. A
      # fresh checkout has no .build, but the check is cheap and that was not.
      - name: Check bundle hygiene
        run: |
          set -euo pipefail
          IPA="$EXPORT/OpenIntelligence.ipa"
          STRAY="$(unzip -l "$IPA" | grep -cE '\.build/|\.pcm$' || true)"
          echo "stray build artifacts in ipa: $STRAY"
          if [ "$STRAY" -ne 0 ]; then
            echo "::error::$STRAY build artifacts inside the ipa. App Store Connect rejects these as 90171."
            exit 1
          fi

      - name: Validate with App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            -f "$EXPORT/OpenIntelligence.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # Kept before the upload so a failed upload still leaves the binary behind.
      - name: Upload the IPA as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenIntelligence-${{ inputs.build_number }}.ipa
          path: ${{ env.EXPORT }}/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            -f "$EXPORT/OpenIntelligence.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ inputs.build_number }}. Processing takes a few minutes before it reads VALID."

      - name: Clean up
        if: always()
        run: |
          security list-keychains -d user -s login.keychain-db || true
          rm -f "$RUNNER_TEMP/build.keychain-db" "$HOME/.appstoreconnect/private_keys/"*.p8 || true

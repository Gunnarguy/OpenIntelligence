# Archive, gate, and upload a build to App Store Connect.
#
# Why this exists: Xcode Cloud hit its compute cap on 2026-08-25 with v5.0
# unsubmitted, and the local path is unavailable to agents because the
# permission classifier blocks App Store Connect uploads. The signing material
# has been in repository secrets since 2026-06-19 and nothing used it:
# release.yml only builds an unsigned Simulator snapshot.
#
# The toolchain is load-bearing. Every Private Cloud Compute path sits behind
# `#if compiler(>=6.4)`. Xcode 26.x ships Swift 6.3 and compiles them out;
# Xcode 27 ships Swift 6.4 and compiles them IN, which would contradict the
# 5.0 release notes and the in-app copy. `latest-stable` is therefore not a
# convenience, it is the safety property, and the nm gate below enforces the
# result rather than trusting it.

name: App Store Upload

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion to stamp. Must exceed the newest build on the train (377 as of 2026-08-25)."
        required: true
        default: "378"
      upload:
        description: "Upload to App Store Connect. Uncheck to archive and validate only."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 90

    env:
      ARCHIVE: ${{ github.workspace }}/build/OpenIntelligence.xcarchive
      EXPORT: ${{ github.workspace }}/build/export

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # latest-stable never resolves to a beta, which is what keeps Swift below
      # 6.4 and PCC compiled out.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Record toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          SWIFT_MAJOR_MINOR="$(swift --version 2>&1 | sed -nE 's/.*Apple Swift version ([0-9]+\.[0-9]+).*/\1/p' | head -1)"
          echo "Swift $SWIFT_MAJOR_MINOR"
          # A belt-and-braces check. The nm gate after the archive is the real
          # one, because it inspects the binary rather than the compiler banner.
          if [ "$(printf '%s\n6.4\n' "$SWIFT_MAJOR_MINOR" | sort -V | head -1)" = "6.4" ]; then
            echo "::error::Swift $SWIFT_MAJOR_MINOR satisfies #if compiler(>=6.4), which compiles PCC IN. Refusing to build a release on this toolchain."
            exit 1
          fi

      # Same guard Xcode Cloud runs: stamps MARKETING_VERSION from CHANGELOG.md
      # and refuses to build when [Unreleased] still has entries.
      - name: Stamp version from CHANGELOG
        working-directory: ci_scripts
        run: sh ci_post_clone.sh

      - name: Import signing certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "Identities available to codesign:"
          security find-identity -v -p codesigning | sed -E 's/[0-9A-F]{40}/<SHA1>/'

      - name: Write App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          # Confirm it parses without printing any key material.
          openssl ec -in "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" -noout \
            && echo "API key parses"

      # -allowProvisioningUpdates with the API key lets Xcode fetch or create the
      # App Store profiles for both the app and the LiveActivities extension,
      # which a fresh runner does not have.
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project OpenIntelligence.xcodeproj \
            -scheme OpenIntelligence \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ inputs.build_number }}

      # The gate. 0 alone is not evidence: a broken grep also returns 0, so the
      # control must be non-zero for the absence to mean anything.
      - name: Gate on Private Cloud Compute symbols
        run: |
          set -euo pipefail
          BIN="$ARCHIVE/Products/Applications/OpenIntelligence.app/OpenIntelligence"
          test -f "$BIN" || { echo "::error::No binary at $BIN"; exit 1; }
          PCC="$(nm -u "$BIN" | grep -c PrivateCloudCompute || true)"
          CONTROL="$(nm -u "$BIN" | grep -c SystemLanguageModel || true)"
          echo "PrivateCloudCompute symbols: $PCC (must be 0)"
          echo "SystemLanguageModel symbols: $CONTROL (control, must be > 0)"
          if [ "$CONTROL" -eq 0 ]; then
            echo "::error::Control is 0, so this check proves nothing. FoundationModels is not linked as expected."
            exit 1
          fi
          if [ "$PCC" -ne 0 ]; then
            echo "::error::$PCC PrivateCloudCompute symbols linked. This build would ship PCC into a release whose notes say it does not."
            exit 1
          fi
          echo "Gate passed: PCC compiled out."

      - name: Export
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>teamID</key><string>Z3E334EXZD</string>
              <key>signingStyle</key><string>automatic</string>
              <key>uploadSymbols</key><true/>
              <key>destination</key><string>export</string>
              <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates
          ls -lh "$EXPORT"

      # A local rsync once copied swift-transformers/.build into the bundle and
      # App Store Connect rejected it as 90171 after a full upload. A fresh
      # checkout has no .build, but the check is cheap and the failure was not.
      - name: Check bundle hygiene
        run: |
          set -euo pipefail
          IPA="$EXPORT/OpenIntelligence.ipa"
          STRAY="$(unzip -l "$IPA" | grep -cE '\.build/|\.pcm$' || true)"
          echo "stray build artifacts in ipa: $STRAY"
          if [ "$STRAY" -ne 0 ]; then
            echo "::error::$STRAY build artifacts inside the ipa. App Store Connect rejects these as 90171."
            exit 1
          fi

      - name: Validate with App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            -f "$EXPORT/OpenIntelligence.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            -f "$EXPORT/OpenIntelligence.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ inputs.build_number }}. Processing takes a few minutes before it appears as VALID."

      # Kept regardless of upload, so a failed run still leaves something to
      # inspect rather than only a log.
      - name: Upload ipa as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenIntelligence-5.0-${{ inputs.build_number }}
          path: ${{ env.EXPORT }}/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up keychain
        if: always()
        run: |
          security list-keychains -d user -s login.keychain-db || true
          rm -f "$RUNNER_TEMP/build.keychain-db" "$HOME/private_keys/"*.p8 || true
